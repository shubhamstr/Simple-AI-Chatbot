<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="chat-wrapper">
        <section class="chat-container" aria-label="AI Chatbot Interface">
            <!-- Header -->
            <header class="chat-header">
                <div class="avatar-container" aria-hidden="true">
                    <div class="chatbot-avatar">🤖</div>
                    <span class="status-indicator" title="Online"></span>
                </div>
                <div class="chat-header-info">
                    <h1 class="chat-title">AI Assistant</h1>
                    <span class="chat-status">Online</span>
                </div>
            </header>

            <!-- Chat Window / Message History -->
            <div class="chat-messages" id="chatMessages" role="log" aria-live="polite">
                <!-- Messages are dynamically inserted here via script.js -->
            </div>

            <!-- Input Area -->
            <footer class="chat-input-area">
                <form id="chatForm" class="chat-form" autocomplete="off">
                    <input 
                        type="text" 
                        id="messageInput" 
                        class="chat-input" 
                        placeholder="Type your message..." 
                        aria-label="Type your message"
                        required
                    />
                    <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message">
                        <span>Send</span>
                        <svg class="send-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
